<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5ff">
<meta name="description" content="Manage customer relationships, call outcomes, and follow-ups on your device.">
<title>YoU Follow ups</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="app.js" type="module"></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#journey"><span class="brand-icon" aria-hidden="true">↗</span><span>YoU <strong>Follow ups</strong></span></a>
    <nav id="side-nav" aria-label="Main navigation"></nav>
    <div class="sidebar-footer">
      <button type="button" data-action="install" class="subtle"><span aria-hidden="true">↓</span> Install options</button>
      <button type="button" data-nav="settings" class="subtle"><span aria-hidden="true">⚙</span> Settings</button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="top-left"><button id="back" class="icon-button" data-action="back" aria-label="Go back" hidden>‹</button><span class="mobile-mark brand-icon" aria-hidden="true">↗</span><h1 id="screen-title">Customer Journey</h1></div>
      <div class="top-right"><time id="today"></time><span id="demo-label" class="chip" hidden>Demo</span><button type="button" data-nav="settings" class="icon-button mobile-settings" aria-label="Settings">⚙</button></div>
    </header>
    <main id="view"></main>
    <nav id="bottom-nav" aria-label="Mobile navigation"></nav>
  </div>
</div>
<div id="toast" role="status" hidden></div>
<dialog id="modal" aria-labelledby="modal-title"></dialog>
<noscript>Enable JavaScript to use YoU Follow ups.</noscript>
</body>
</html>
