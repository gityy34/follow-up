plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

def releaseSigning = [
    storePath: providers.environmentVariable('FOLLOW_UP_KEYSTORE'),
    storePassword: providers.environmentVariable('FOLLOW_UP_STORE_PASSWORD'),
    keyAlias: providers.environmentVariable('FOLLOW_UP_KEY_ALIAS'),
    keyPassword: providers.environmentVariable('FOLLOW_UP_KEY_PASSWORD')
]
def canSignRelease = releaseSigning.values().every { it.isPresent() && !it.get().isBlank() }

android {
    namespace = 'com.followup.tracker'
    compileSdk = 36
    buildToolsVersion = '36.0.0'

    buildFeatures { compose = true }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = 'com.followup.tracker'
        minSdk = 26
        targetSdk = 36
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        versionCode = 4
        versionName = '1.3.0'
    }

    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile = rootProject.file(releaseSigning.storePath.get())
                storePassword = releaseSigning.storePassword.get()
                keyAlias = releaseSigning.keyAlias.get()
                keyPassword = releaseSigning.keyPassword.get()
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
            resValue 'string', 'app_name', 'YoU Follow ups Debug'
        }
        release {
            if (canSignRelease) {
                signingConfig = signingConfigs.release
            }
            resValue 'string', 'app_name', 'YoU Follow ups'
        }
    }
}

kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

kapt {
    arguments { arg('room.schemaLocation', file('schemas').absolutePath) }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.compose.material:material-icons-core:1.6.0'
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    kapt 'androidx.room:room-compiler:2.7.2'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!canSignRelease) {
            throw new GradleException('Set FOLLOW_UP_KEYSTORE, FOLLOW_UP_STORE_PASSWORD, FOLLOW_UP_KEY_ALIAS and FOLLOW_UP_KEY_PASSWORD to build a signed release.')
        }
    }
}

tasks.matching { it.name == 'packageRelease' || it.name == 'signReleaseBundle' }.configureEach {
    dependsOn(verifyReleaseSigning)
}
